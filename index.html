<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Spotify - Kendrick Lamar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <div class="app-container">
        
        <!-- PANEL IZQUIERDO -->
        <div class="player-container">
            <div class="player-header">
                <h2>REPRODUCIENDO</h2>
                <h1>Kendrick Essentials</h1>
            </div>
            
            <div class="cover-container">
                <img src="imagenes/portada.jpg" alt="Portada" id="cover" class="cover-image">
            </div>

            <div class="track-info">
                <h2 id="title">HUMBLE.</h2>
                <h3 id="artist">Kendrick Lamar</h3>
            </div>

            <div class="progress-container">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0">
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button id="prev"><i class="fas fa-backward-step"></i></button>
                <button id="play" class="play-btn"><i class="fas fa-play" id="play-icon"></i></button>
                <button id="next"><i class="fas fa-forward-step"></i></button>
            </div>
            
            <!-- EL DISCO DE VINILO -->
            <div class="vinyl-container">
                <div class="vinyl-record" id="vinyl"></div>
            </div>
            
            <audio id="audio" src=""></audio>
        </div>

        <!-- PANEL DERECHO -->
        <div class="playlist-container">
            <div class="playlist-header">
                <h2>BIBLIOTECA</h2>
                <h1 id="playlist-title">Tus Carpetas</h1>
            </div>
            
            <!-- VISTA 1: Los botones de carpetas -->
            <div id="categories-view" class="categories-grid">
                <button class="category-btn" data-genre="rap">
                    <span class="emoji">🎤</span> RAP
                </button>
                <button class="category-btn" data-genre="rave">
                    <span class="emoji">🪩</span> RAVE
                </button>
                <button class="category-btn" data-genre="reggaeton">
                    <span class="emoji">🔥</span> REGGAETÓN
                </button>
                <button class="category-btn" data-genre="pop">
                    <span class="emoji">🎸</span> POP
                </button>
            </div>

            <!-- VISTA 2: La lista de canciones (Oculta al inicio) -->
            <div id="songs-view" class="hidden">
                <button id="back-btn" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Volver atrás
                </button>
                
                <!-- Aquí aparecerán las canciones de la carpeta seleccionada -->
                <ul id="current-playlist" class="playlist-list"></ul>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
